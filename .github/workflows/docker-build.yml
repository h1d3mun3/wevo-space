name: Docker Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (e.g. 1.2.3 or latest)"
        required: true
        default: "latest"
        type: string

env:
  IMAGE: h1d3mun3/wevo-space

jobs:
  Test:
    uses: ./.github/workflows/unit-test.yml

  Build:
    needs: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set platform tag suffix
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  Merge:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tags=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            CURRENT=$(grep -oP 'version: "\K[0-9]+\.[0-9]+\.[0-9]+' Sources/WevoSpace/routes.swift || true)
            PREVIOUS=$(git show HEAD^:Sources/WevoSpace/routes.swift 2>/dev/null | grep -oP 'version: "\K[0-9]+\.[0-9]+\.[0-9]+' || true)
            TAGS="latest"
            if [ -n "$CURRENT" ] && [ "$CURRENT" != "$PREVIOUS" ]; then
              TAGS="$TAGS $CURRENT"
            fi
            echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          TAG_ARGS=""
          for t in $TAGS; do
            TAG_ARGS="$TAG_ARGS -t $IMAGE:$t"
          done
          docker buildx imagetools create $TAG_ARGS \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker buildx imagetools inspect "$IMAGE:$t"
          done
